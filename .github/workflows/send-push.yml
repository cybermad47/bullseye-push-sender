name: BULLSEYE push sender

# Five offset 5-minute schedules give ~1-minute polling. Each individual
# schedule is 5 minutes apart (GitHub's minimum), and public repos get
# unlimited free Actions minutes. GitHub may delay runs under load.
on:
  schedule:
    - cron: '0-59/5 * * * *'
    - cron: '1-59/5 * * * *'
    - cron: '2-59/5 * * * *'
    - cron: '3-59/5 * * * *'
    - cron: '4-59/5 * * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --omit=dev
      - run: node scripts/send.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: https://work-schedule-32208-default-rtdb.europe-west1.firebasedatabase.app
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
